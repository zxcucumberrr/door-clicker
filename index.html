<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кликер дверей</title>
<style>
:root{--bg:#f4efe6;--card:#fffaf0;--ink:#2b2118;--mute:#7a6a58;--acc:#c0392b;--line:#e2d6c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#271f19;--ink:#f3e9db;--mute:#a8967f;--line:#3a2f26}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#271f19;--ink:#f3e9db;--mute:#a8967f;--line:#3a2f26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px;text-align:center}
.score{text-align:center}
.score b{font-size:36px;display:block}
.score span{color:var(--mute);font-size:14px}
.wrap{position:relative;display:flex;justify-content:center;margin:18px 0}
#door{width:min(320px,82vw);aspect-ratio:1;padding:0;border:0;background:#fff;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
#door img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .05s;pointer-events:none}
#door:active img{transform:scale(.96)}
.pop{position:absolute;top:40px;font-weight:700;color:var(--acc);pointer-events:none;animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
h2{font-size:16px;margin:20px 0 8px}
.shop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.shop img{width:56px;height:70px;object-fit:contain;background:#fff;border-radius:6px}
.shop .t{flex:1}
.shop .t div:first-child{font-weight:600}
.shop .t div:last-child{font-size:13px;color:var(--mute)}
.shop:disabled{opacity:.55;cursor:not-allowed}
.shop.own{opacity:1;border-color:var(--acc)}
.shop:not(:disabled):hover{border-color:var(--acc)}
</style>
</head>

<main>

const DOORS=[
{n:"Белая дверь",c:0,p:1},
{n:"Тёмная дверь с волнами",c:50,p:5},
{n:"Дубовая со стеклом",c:500,p:25},
{n:"Классическая резная",c:5000,p:150}
];
let S={cars:0,own:[true,false,false,false]};
try{const r=JSON.parse(localStorage.getItem("doorclicker2")||"null");if(r&&r.own&&r.own.length===DOORS.length)S=r}catch(e){}
const best=()=>S.own.lastIndexOf(true);
const fmt=x=>Math.floor(x).toLocaleString("ru-RU");
const shop=document.getElementById("shop");
DOORS.forEach((d,i)=>{if(!i)return;const b=document.createElement("button");b.className="shop";b.id="s"+i;
b.innerHTML=`<img src="${IMG[i]}" alt=""><span class="t"><div>${d.n}</div><div></div></span>`;
b.onclick=()=>{if(!S.own[i]&&S.cars>=d.c){S.cars-=d.c;S.own[i]=true;render()}};shop.appendChild(b)});
function render(){
document.getElementById("score").textContent=fmt(S.cars);
document.getElementById("cur").src=IMG[best()];
document.getElementById("pw").textContent="+"+DOORS[best()].p;
DOORS.forEach((d,i)=>{if(!i)return;const b=document.getElementById("s"+i);
b.classList.toggle("own",S.own[i]);
b.querySelector(".t div:last-child").textContent=S.own[i]?"Куплена ✓ · +"+d.p+" за клик":fmt(d.c)+" 🚗 · +"+d.p+" за клик";
b.disabled=S.own[i]||S.cars<d.c});
try{localStorage.setItem("doorclicker2",JSON.stringify(S))}catch(e){}}
document.getElementById("door").onclick=()=>{
const v=DOORS[best()].p;S.cars+=v;render();
const p=document.createElement("div");p.className="pop";p.textContent="+"+v+" 🚗";
p.style.left=(40+Math.random()*20)+"%";document.querySelector(".wrap").appendChild(p);setTimeout(()=>p.remove(),800)};
render();
</script>
