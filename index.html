<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кликер дверей</title>
<style>
:root{--bg:#f4efe6;--card:#fffaf0;--ink:#2b2118;--mute:#7a6a58;--acc:#c0392b;--line:#e2d6c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#271f19;--ink:#f3e9db;--mute:#a8967f;--line:#3a2f26}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#271f19;--ink:#f3e9db;--mute:#a8967f;--line:#3a2f26}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px;text-align:center}
.score{text-align:center}
.score b{font-size:36px;display:block}
.score span{color:var(--mute);font-size:14px}
.cnt{display:flex;align-items:center;justify-content:center;gap:10px}
.cnt img{height:30px}
.ci{height:18px;vertical-align:middle}
.pop img.pc{height:26px}
.rolls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:14px;color:var(--mute)}
.rolls img{height:30px}
.rolls b{display:inline;font-size:20px;color:var(--ink)}
.stage{margin:14px 0;padding:16px;border-radius:16px;transition:background .3s}
.wrap{position:relative;display:flex;justify-content:center;align-items:center;min-height:min(380px,52vh)}
#door{padding:0;border:0;background:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;display:block}
#door img{height:min(380px,52vh);width:auto;max-width:82vw;display:block;transition:transform .05s;pointer-events:none}
#door:active img{transform:scale(.96)}
.pop{position:absolute;top:30px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;animation:up .8s ease-out forwards;display:flex;align-items:center;gap:4px}
.pop img{height:44px}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.tabs{display:flex;gap:8px;margin:8px 0 12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.shop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.shop>img{width:56px;height:70px;object-fit:contain}
.sw{width:56px;height:56px;border-radius:8px;border:1px solid var(--line)}
.shop .t{flex:1}
.shop .t div:first-child{font-weight:600}
.shop .t div:last-child{font-size:13px;color:var(--mute)}
.ri{height:22px;vertical-align:middle}
.shop:disabled{opacity:.55;cursor:not-allowed}
.shop.own{opacity:1;border-color:var(--line)}
.shop.sel{border-color:var(--acc)}
.shop:not(:disabled):hover{border-color:var(--acc)}
.stage{position:relative}
.wrap{z-index:1}
#stk{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;border-radius:16px}
.stage.editing{outline:2px dashed var(--acc)}
.stage.editing #stk{z-index:2;pointer-events:auto}
.stage.editing .wrap{pointer-events:none}
.st{position:absolute;transform:translate(-50%,-50%);height:auto;touch-action:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage.editing .st{pointer-events:auto;cursor:grab}
.st.sel{outline:2px dashed #fff;outline-offset:2px}
.edbar{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 12px}
.edbar button,.editbtn{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.edbar button{flex:1 1 28%}
.editbtn{margin-bottom:10px}
.hint{font-size:13px;color:var(--mute);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.sk img{height:56px;width:100%;object-fit:contain}
.sk .n{font-size:12px;font-weight:600}
.sk .pr{font-size:12px;color:var(--mute)}
.sk:disabled{opacity:.55;cursor:not-allowed}
.sk:not(:disabled):hover{border-color:var(--acc)}
.rp{position:absolute;height:50px;transform:translate(-50%,-50%);cursor:pointer;z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));-webkit-tap-highlight-color:transparent;animation:rpin .25s ease-out,bob 1.4s ease-in-out .25s infinite,fade 10s linear forwards}
@keyframes fade{0%,30%{opacity:1}100%{opacity:0}}
@keyframes rpin{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}

.head{position:relative}
.wbtn{position:absolute;right:0;top:-2px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.wmenu{position:absolute;right:0;top:44px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.wmenu button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;cursor:pointer}
.wmenu button:disabled{opacity:.5;cursor:not-allowed}
.wmenu button.cur{font-weight:700;color:var(--acc)}
.wname{text-align:center;color:var(--mute);font-size:13px;margin:-6px 0 8px}
.rebirth{width:100%;padding:14px;margin:0 0 12px;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="head"><h1>🚪 Кликер дверей</h1><button class="wbtn" id="wbtn" aria-label="Миры">🌍</button><div class="wmenu" id="wmenu" hidden></div></div>
<div class="wname" id="wname"></div>
<div class="score"><div class="cnt"><img data-car alt=""><b id="score">0</b></div><span>Cherry Tiggo · <span id="pw"></span> за клик<span id="mu"></span></span>
<div class="rolls"><img data-roll alt=""><b id="rolls">0</b><span>Сяки маки · шанс 1,488% за клик</span></div></div>
<div class="stage" id="stage"><div id="stk"></div><div class="wrap"><button id="door"><img id="cur" alt="Дверь" draggable="false"></button></div></div>
<button class="rebirth" id="rb" hidden></button>
<div class="edbar" id="edbar" hidden><button id="e-">− Меньше</button><button id="e+">+ Больше</button><button id="ef">↔ Отразить</button><button id="er">⟳ Повернуть</button><button id="ed">🗑 Убрать</button><button id="eok">Готово</button></div>
<div class="tabs"><button id="tb-doors" class="on">🚪 Двери</button><button id="tb-bgs">🎨 Фоны</button><button id="tb-stk">✨ Наклейки</button></div>
<div id="tab-doors"><div id="shop"></div><p class="hint" id="nodoor" hidden>Новые двери этого мира скоро появятся.</p></div>
<div id="tab-bgs" hidden><div id="bgshop"></div><p class="hint" id="nobg" hidden>Фоны для этого мира скоро появятся.</p></div>
<div id="tab-stk" hidden><p class="hint">Нажми на наклейку, чтобы поставить её на фон за дверью. Потом перетащи куда нужно. Купленную можно ставить сколько угодно раз.</p><button class="editbtn" id="editbtn">✏️ Расставить наклейки</button><div class="grid" id="stkshop"></div></div>
</main>

let S={rolls:0,rb:0,w:0,unl:[true,false],W:WORLDS.map((_,i)=>newW(i)),bgs:{none:true},stOwn:{},stk:[],nid:0};
try{const r=JSON.parse(localStorage.getItem("doorclicker2")||"null");
if(r&&r.W)S=Object.assign(S,r);
else if(r&&r.own){Object.assign(S,{rolls:r.rolls||0,stOwn:r.stOwn||{},stk:r.stk||[],nid:r.nid||0});
Object.assign(S.W[0],{cars:r.cars||0,own:r.own,bgs:r.bgs||{none:true},bg:r.bg||"none"})}}catch(e){}
WORLDS.forEach((w,i)=>{S.W[i]=S.W[i]||newW(i);while(S.W[i].own.length<w.doors.length)S.W[i].own.push(false);S.unl[i]=!!S.unl[i]});
S.unl[0]=true;
if(S.rb>0&&S.unl[1]&&S.W[0].rbd===undefined)S.W[0].rbd=true;
S.bgs=Object.assign({none:true},S.bgs||{},...S.W.map(w=>w.bgs||{}));
const cw=()=>S.W[S.w],WD=()=>WORLDS[S.w],best=()=>cw().own.lastIndexOf(true),pw=()=>WD().doors[best()].p*MU();
document.querySelectorAll("img[data-roll]").forEach(i=>i.src=ROLL);
document.querySelectorAll("img[data-car]").forEach(i=>i.src=CAR);
const shop=$("shop"),bgshop=$("bgshop"),rb=$("rb"),wmenu=$("wmenu");
function buildShops(){shop.innerHTML="";bgshop.innerHTML="";
WD().doors.forEach((d,i)=>{if(!i)return;const b=document.createElement("button");b.className="shop";b.id="s"+i;
b.innerHTML=`<img src="${d.i}" alt=""><span class="t"><div>${d.n}</div><div></div></span>`;
b.onclick=()=>{const w=cw();if(!w.own[i]&&w.cars>=d.c){w.cars-=d.c;w.own[i]=true;render()}};shop.appendChild(b)});
if(WD().bgs.length>1)WD().bgs.forEach(g=>{const b=document.createElement("button");b.className="shop";b.id="g"+g.id;
b.innerHTML=`<span class="sw" style="background:${g.css}"></span><span class="t"><div>${g.n}</div><div></div></span>`;
b.onclick=()=>{const w=cw();if(S.bgs[g.id])w.bg=g.id;else if(S.rolls>=g.c){S.rolls-=g.c;S.bgs[g.id]=true;w.bg=g.id}render()};bgshop.appendChild(b)})}
function render(){
const w=cw(),W_=WD(),bi=best(),cur=$("cur"),key=S.w+"-"+bi;
$("score").textContent=fmt(w.cars);$("rolls").textContent=fmt(S.rolls);
if(cur.dataset.i!==key){cur.src=W_.doors[bi].i;cur.dataset.i=key}
$("pw").textContent="+"+num(pw());$("mu").textContent=S.rb?" · ×"+ +MU().toFixed(2):"";
$("wname").textContent="Мир: "+W_.n;
W_.doors.forEach((d,i)=>{if(!i)return;const b=$("s"+i),own=w.own[i];b.classList.toggle("own",own);
b.querySelector(".t div:last-child").innerHTML=(own?"Куплена ✓":fmt(d.c)+" "+car)+" · +"+num(d.p*MU())+" за клик";b.disabled=own||w.cars<d.c});
if(W_.bgs.length>1)W_.bgs.forEach(g=>{const b=$("g"+g.id),own=!!S.bgs[g.id],sel=w.bg===g.id;
b.classList.toggle("own",own);b.classList.toggle("sel",sel);
b.querySelector(".t div:last-child").innerHTML=sel?"Выбран ✓":own?"Куплен · нажми, чтобы выбрать":g.c+" "+ri;b.disabled=!own&&S.rolls<g.c});
$("nodoor").hidden=W_.doors.length>1;$("nobg").hidden=W_.bgs.length>1;
$("stage").style.background=(W_.bgs.find(g=>g.id===w.bg)||W_.bgs[0]).css;
rb.hidden=!(W_.doors.length>1&&w.own.every(Boolean)&&!w.rbd&&!W_.noRb);
if(!rb.dataset.arm)rb.textContent="🔄 Ребитх · ×1.25 к клику";
stkShop();save()}
let rbT;
rb.onclick=()=>{if(!rb.dataset.arm){rb.dataset.arm=1;rb.textContent="Точно? Сбросятся двери, фоны и роллы. Нажми ещё раз";
rbT=setTimeout(()=>{delete rb.dataset.arm;render()},5000);return}
clearTimeout(rbT);delete rb.dataset.arm;S.rb++;S.rolls=0;const kb=cw().bg;S.W[S.w]=newW(S.w);cw().bg=kb;cw().rbd=true;
if(S.w+1<WORLDS.length){S.unl[S.w+1]=true;S.w++}applyWorld()};
function applyWorld(){document.querySelectorAll(".rp").forEach(e=>e.remove());buildShops();tab("doors");$("cur").dataset.i="";render()}
function menu(){wmenu.innerHTML="";WORLDS.forEach((w,i)=>{const b=document.createElement("button");b.className=i===S.w?"cur":"";b.disabled=!S.unl[i];
b.textContent=(S.unl[i]?"":"🔒 ")+w.n+(i===S.w?" ✓":"")+(S.unl[i]?"":" · после ребитха");
b.onclick=()=>{S.w=i;wmenu.hidden=true;applyWorld()};wmenu.appendChild(b)})}
$("wbtn").onclick=()=>{menu();wmenu.hidden=!wmenu.hidden};
document.addEventListener("click",e=>{if(!e.target.closest(".head"))wmenu.hidden=true});
function pop(html,left){const p=document.createElement("div");p.className="pop";p.innerHTML=html;
p.style.left=left+"%";document.querySelector(".wrap").appendChild(p);setTimeout(()=>p.remove(),800)}
$("door").onclick=()=>{const v=pw();cw().cars+=v;const got=Math.random()<0.01488;render();
pop("+"+num(v)+" <img class='pc' src='"+CAR+"' alt=''>",25+Math.random()*20);if(got)spawnRoll()};
function tab(t){["doors","bgs","stk"].forEach(k=>{$("tab-"+k).hidden=k!==t;$("tb-"+k).classList.toggle("on",k===t)})}
$("tb-doors").onclick=()=>tab("doors");$("tb-bgs").onclick=()=>tab("bgs");$("tb-stk").onclick=()=>tab("stk");
const PRICE=5;
let sel=null,editing=false;
const stk=$("stk"),stage=$("stage"),kshop=$("stkshop");
function save(){try{localStorage.setItem("doorclicker2",JSON.stringify(S))}catch(e){}}
STK.forEach(s=>{const b=document.createElement("button");b.className="sk";b.id="k_"+s.id;
b.innerHTML=`<img src="${s.img}" alt=""><div class="n">${s.n}</div><div class="pr"></div>`;
b.onclick=()=>{if(!S.stOwn[s.id]){if(S.rolls<PRICE)return;S.rolls-=PRICE;S.stOwn[s.id]=true}
const o={u:"u"+(++S.nid),k:s.id,x:15+Math.random()*70,y:15+Math.random()*70,w:24};S.stk.push(o);sel=o.u;edit(true);render()};kshop.appendChild(b)});
function stkShop(){STK.forEach(s=>{const b=$("k_"+s.id),own=S.stOwn[s.id];
b.querySelector(".pr").innerHTML=own?"Поставить ещё":PRICE+" "+ri;b.disabled=!own&&S.rolls<PRICE})}
function drawStk(){stk.innerHTML="";S.stk.forEach(o=>{const s=STK.find(z=>z.id===o.k);if(!s)return;
const im=document.createElement("img");im.src=s.img;im.draggable=false;im.className="st"+(editing&&o.u===sel?" sel":"");
im.style.cssText=`left:${o.x}%;top:${o.y}%;width:${o.w}%;transform:translate(-50%,-50%) rotate(${o.r||0}deg) scaleX(${o.f?-1:1})`;
im.onpointerdown=e=>{if(!editing)return;e.preventDefault();sel=o.u;
stk.querySelectorAll(".st").forEach(x=>x.classList.remove("sel"));im.classList.add("sel");im.setPointerCapture(e.pointerId);
const r=stage.getBoundingClientRect();
im.onpointermove=ev=>{o.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));o.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));im.style.left=o.x+"%";im.style.top=o.y+"%"};
im.onpointerup=()=>{im.onpointermove=null;im.onpointerup=null;save()}};
stk.appendChild(im)})}
function edit(on){editing=on;stage.classList.toggle("editing",on);$("edbar").hidden=!on;if(!on)sel=null;drawStk()}
const curS=()=>S.stk.find(z=>z.u===sel);
$("editbtn").onclick=()=>edit(true);
$("eok").onclick=()=>{edit(false);save()};
$("e-").onclick=()=>{const o=curS();if(o){o.w=Math.max(6,o.w-3);drawStk();save()}};
$("e+").onclick=()=>{const o=curS();if(o){o.w=Math.min(80,o.w+3);drawStk();save()}};
$("ed").onclick=()=>{S.stk=S.stk.filter(z=>z.u!==sel);sel=null;drawStk();save()};
$("ef").onclick=()=>{const o=curS();if(o){o.f=!o.f;drawStk();save()}};
$("er").onclick=()=>{const o=curS();if(o){o.r=((o.r||0)+15)%360;drawStk();save()}};
function spawnRoll(){const w=$("stage"),im=document.createElement("img"),x=10+Math.random()*80;
im.src=ROLL;im.className="rp";im.alt="";im.draggable=false;im.style.left=x+"%";im.style.top=(12+Math.random()*76)+"%";
im.onclick=()=>{im.remove();S.rolls++;render();pop("+1 <img src='"+ROLL+"' alt=''>",x)};w.appendChild(im);setTimeout(()=>im.remove(),10000)}
buildShops();drawStk();render();
</script>
</body>
</html>
